{% extends "base.html" %}

{% block title %}Home{% endblock %}

{% block content %}
    <h1>Our Products</h1>
    {% for product in products %}
        <div class="product">
            <h2><a href="{{ url_for('main.product_detail', product_id=product.id) }}">{{ product.name }}</a></h2>
            <p>{{ product.description[:100] }}...</p>
            <p>Price: GHS {{ "%.2f"|format(product.price / 100.0) }}</p>
            <form action="{{ url_for('cart.add_to_cart', product_id=product.id) }}" method="post">
                <button type="submit">Add to Cart</button>
            </form>
        </div>
    {% else %}
        <p>No products found.</p>
    {% endfor %}
{% endblock %}
